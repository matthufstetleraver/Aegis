# hooks.yml
# Optional hooks executed before or after Aegis Spec forward skills.
#
# Per-hook schema:
#   command:     command to suggest (optional: true) or require (optional: false)
#   description: short text shown to the user
#   enabled:     true | false. If omitted, treated as true.
#   optional:    true (shows clickable link) | false (runs automatically and waits)
#
# Rules:
#   Invalid YAML here is tolerated: the skill continues normally, just without hooks.
#   There is no condition DSL in this file. If a hook should not run, use enabled: false.
#
# By default, all hooks are empty. Add only the ones that make sense for your project.

schema-version: 1

