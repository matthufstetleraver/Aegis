# Aegis Spec — Project Configuration
# This file is managed by the installer. For customizations, edit config.user.toml

[project]
name = ""
version = "1.0.0"

[user]
name = ""
chat_language = "pt-br"
doc_language = "pt-br"

[output]
folder = "aegis"

[agents]
installed = [
  "aegis-scout",
  "aegis-archaeologist",
  "aegis-detective",
  "aegis-architect",
  "aegis-writer",
  "aegis-reviewer",
  "aegis-visor",
  "aegis-data-master",
  "aegis-design-system"
]

[engines]
installed = []

[analysis]
answer_mode = "chat"
doc_level = "complete"

# Organization of specs generated by agents.
# This section is filled by Aegis Spec after Scout suggests a structure
# and the user confirms the choice in the menu (right after the doc_level question).
# To reshow the menu, remove the entire [specs] section and run Aegis Spec again.
[specs]
layout = ""              # constant "feature-folder" after first run
granularity = ""         # module | use-case | endpoint | hybrid | feature | custom
custom_folders = []      # populated only when granularity == "custom"
scout_suggestion = ""    # record of original Scout suggestion, immutable after 1st run
decided_at = ""          # ISO 8601 timestamp of user's choice
